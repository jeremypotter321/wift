<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- graphite body, like a dark Silberpfeil paint -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363D47"/>
      <stop offset="0.55" stop-color="#1A1F26"/>
      <stop offset="1" stop-color="#0C0F13"/>
    </linearGradient>
    <!-- brushed chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#D9DEE5"/>
      <stop offset="0.5" stop-color="#9AA3AF"/>
      <stop offset="0.62" stop-color="#E8ECF1"/>
      <stop offset="1" stop-color="#A7B0BC"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D0D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5B6470" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- wrench cut-outs: jaw opening + ring hole -->
    <mask id="wrenchMask">
      <rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/>
      <rect x="-470" y="-50" width="190" height="100" fill="#000"/>
      <polygon points="272,0 247,43 197,43 172,0 197,-43 247,-43" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <!-- touring-car livery stripes, bottom-left to top-right -->
    <g transform="translate(512 512) rotate(-45)">
      <rect x="-800" y="-210" width="1600" height="62" fill="#C7CDD5"/>
      <rect x="-800" y="-128" width="1600" height="96" fill="#3B82F6"/>
      <rect x="-800" y="-12" width="1600" height="132" fill="#1D4ED8"/>
      <rect x="-800" y="140" width="1600" height="18" fill="#C7CDD5" opacity="0.55"/>
    </g>
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
  </g>
  <!-- chrome rim -->
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <!-- combination wrench crossing the stripes, top-left to bottom-right -->
  <g transform="translate(512 512) rotate(45)" filter="url(#shadow)">
    <g mask="url(#wrenchMask)" fill="url(#chrome)" stroke="#5B6470" stroke-width="4">
      <path d="M -300 -52 L 210 -52 L 210 52 L -300 52 Z"/>
      <circle cx="-335" cy="0" r="122"/>
      <circle cx="222" cy="0" r="104"/>
    </g>
    <!-- shaft fluting, the engineered detail -->
    <rect x="-180" y="-16" width="320" height="32" rx="16" fill="#8B95A3" opacity="0.55"/>
  </g>
</svg>
